<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Software Factory</title>
  <link rel="stylesheet" href="/style.css">
</head>
<body>
  <header>
    <h1>Software Factory</h1>
    <span id="state" class="pill">…</span>
    <span id="mode" class="pill muted"></span>
    <span class="spacer"></span>
    <button id="btn-pause" data-act="pause" hidden>Pause</button>
    <button id="btn-resume" data-act="resume" hidden>Resume</button>
    <button id="btn-stop" data-act="stop" class="danger">Emergency stop</button>
    <button id="btn-clear" data-act="clear-stop" hidden>Clear stop</button>
  </header>
  <nav id="nav">
    <a href="#/">Overview</a><a href="#/jobs">Jobs</a><a href="#/projects">Projects</a><a href="#/health">Health</a>
    <span id="auth" class="muted"></span>
  </nav>
  <div id="banner" hidden></div>
  <main id="view"></main>
  <script src="/app.js"></script>
</body>
</html>
