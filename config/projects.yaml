# Your projects. Normally you do not edit this by hand: add and change them in the dashboard (Settings > Projects).
# This copy is the shipped default (empty). Your own copy lives in ~/.software-factory/config/projects.yaml.
#
# One Linear project <-> one repository. Example:
#
# projects:
#   - id: my-app
#     name: My App
#     defaultBranch: main
#     autonomy: supervised            # supervised | full | off   (raise to full only after validation passes cleanly)
#     commands: { install: "npm ci", typecheck: "npx tsc --noEmit", lint: "npm run lint", test: "npm test" }
#     # Optional browser checks, run after test: visual: "pnpm exec playwright test" (needs allowLoopback: true for a webServer on 127.0.0.1)
#     github: { account: my-github-user, repo: my-github-user/my-app }   # the factory clones this itself
#     linear: { teamKey: ENG, projectName: "My App" }
#
# Use `repository: ~/path/to/checkout` instead of `github.repo` to point at an existing checkout (worktrees are still separate).
projects: []
