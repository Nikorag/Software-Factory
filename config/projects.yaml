# Enrolled repositories. One Linear project <-> one repository, all under the Nikorag GitHub account.
# New projects start `supervised`; raise to `full` only once validation passes cleanly (see docs/integrations.md).
projects:
  - id: zonto-hub
    name: Zonto Hub
    repository: ~/projects/personal/Zonto/Zonto-Hub
    defaultBranch: main
    enabled: true
    specKit: true
    autonomy: supervised
    github: { account: Nikorag }
    linear: { teamKey: JAM, projectName: "Zonto Hub" }

