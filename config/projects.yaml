# Enrolled repositories. One Linear project <-> one repository, all under the Nikorag GitHub account.
# Entries with `github.repo` and no `repository` are factory-managed clones in <dataDir>/projects/<id>
# (`pnpm factory project:sync` creates them). The factory never works in your own checkouts for these.
# Everything starts `supervised`; raise to `full` only after validation passes cleanly (see docs/integrations.md).
# Enrolling does not start work: only issues labelled factory:enabled in "Ready for specification" are picked up.
projects:
  - id: zonto-hub
    name: Zonto Hub
    repository: ~/projects/personal/Zonto/Zonto-Hub   # your existing checkout (left untouched; factory worktrees are separate)
    defaultBranch: main
    autonomy: supervised
    github: { account: Nikorag }
    linear: { teamKey: JAM, projectName: "Zonto Hub" }

  - id: brotherly-love
    name: "Brotherly Love"
    defaultBranch: main
    autonomy: supervised
    github: { account: Nikorag, repo: Nikorag/Brotherly-Love }
    linear: { teamKey: JAM, projectName: "Brotherly Love" }

