# Model routing. `pnpm factory doctor` lists what the local server actually has loaded.
#
# provider `anthropic` = Claude Code CLI using your logged-in subscription (no API key).
#   model `default` means "let Claude Code choose"; otherwise a model id passed as --model.
# provider `local` = the Bionic/LM Studio-style server below. The model id must match what the server reports.
#   UNCONFIGURED-* values make the router refuse to call the local model until you set a real id.
# specification and implementation must stay `anthropic` (they need file and shell tools).
local:
  baseUrl: http://127.0.0.1:1234/v1   # UNVERIFIED for Bionic: start its API server, then run `pnpm factory doctor`
  requestTimeoutSeconds: 300
routes:
  classification:     { provider: local,     model: UNCONFIGURED-QWEN }
  specification:      { provider: anthropic, model: default }
  implementation:     { provider: anthropic, model: default }
  independent_review: { provider: local,     model: UNCONFIGURED-QWEN }
  final_review:       { provider: anthropic, model: default }
