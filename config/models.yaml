# Model routing.
#
# provider `anthropic` = Claude Code CLI using your logged-in subscription (no API key).
#   model `default` = let Claude Code choose; an alias (`haiku`, `sonnet`, `opus`) tracks that family's latest;
#   a full id (e.g. claude-haiku-5-5) pins it.
# provider `local` = any OpenAI-compatible server (LM Studio, llama.cpp, Ollama...). Optional and off by default: Claude Haiku does classification and review.
#   If you route to it, the model id must match what `pnpm factory doctor` reports.
# specification and implementation must stay `anthropic` (they need file and shell tools).
#
# independent_review is OPTIONAL and unset by default: with no independent reviewer the spec review and the independent code review
# are skipped (a Claude-only setup does not need them; the Claude review and security review still run). To use one, set any
# OpenAI-compatible endpoint, a different model from `specification` so the reviewer is not marking its own work:
#   independent_review: { provider: local, model: gpt-4o-mini, baseUrl: https://api.openai.com/v1, apiKeyEnv: OPENAI_API_KEY }
# apiKeyEnv is the NAME of an environment variable holding the key; the key itself is never stored here. Omit it for no auth header.
# Older setups that route it to Claude (`{ provider: anthropic, model: haiku }`) keep working.
# `pnpm factory doctor` warns if the reviewer matches `specification`.
local:
  baseUrl: http://127.0.0.1:1234/v1
  requestTimeoutSeconds: 300
independentReviewFallback: claude   # only applies if the independent_review endpoint is unavailable
routes:
  classification:     { provider: anthropic, model: haiku }
  specification:      { provider: anthropic, model: default }
  implementation:     { provider: anthropic, model: default }
  # independent_review: unset = skipped (see above)
  final_review:       { provider: anthropic, model: default }
  prompt_generation:  { provider: anthropic, model: haiku }   # haiku_prompt mode: writes the implementer's prompt (must be anthropic)
