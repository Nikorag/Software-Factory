# Factory-wide settings. Agents must never be able to modify this directory (see protectedPaths).
dataDir: ~/.software-factory     # database, logs, project clones, worktrees
server:
  host: 127.0.0.1                # loopback only
  port: 4780
logLevel: info
dryRun: false                    # true: discover and plan, never mutate repos or Linear
mergeMode: pr-only               # the factory raises pull requests and NEVER merges them; a human merges
workflow:
  planning_mode: haiku_prompt    # haiku_prompt: Haiku reads the repo and writes the implementer's prompt (fast, default). speckit: the full Spec Kit flow
  max_conflict_resolutions: 3    # how many times Claude may resolve merge conflicts on one PR before a human is asked
maxRemediationAttempts: 3
maxConcurrentJobs: 1             # raise only after measuring memory headroom
pollIntervalSeconds: 60
hub:                             # report progress to a central Software Factory Hub. Off until you run `factory hub connect`
  enabled: false
  url: ""
  remoteAccess: false            # let the hub's web dashboard operate this factory. Separate from reporting; turn on with `factory hub remote-access on`
