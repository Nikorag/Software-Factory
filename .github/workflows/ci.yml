name: CI
on:
  push: { branches: [main] }
  pull_request:
jobs:
  test:
    # macOS: the sandbox that runs project commands (sandbox-exec) only exists there.
    runs-on: macos-latest
    env:
      ELECTRON_SKIP_BINARY_DOWNLOAD: "1" # the tests never open the app window
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with: { node-version: 24, cache: pnpm }
      - run: pnpm install --frozen-lockfile
      - run: pnpm typecheck
      - run: pnpm lint
      - run: pnpm test
      - run: pnpm --filter software-factory-hub typecheck
      - run: pnpm --filter software-factory-hub test
