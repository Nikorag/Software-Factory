name: Hub image
on:
  push:
    branches: [main]
    paths: ["hub/**", "pnpm-lock.yaml", "pnpm-workspace.yaml", ".dockerignore", ".github/workflows/hub-image.yml"]
  pull_request:
    paths: ["hub/**", "pnpm-lock.yaml", "pnpm-workspace.yaml", ".dockerignore", ".github/workflows/hub-image.yml"]
  workflow_dispatch:

permissions:
  contents: read
  packages: write

env:
  IMAGE: ghcr.io/nikorag/software-factory-hub

jobs:
  image:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - id: v
        run: |
          echo "version=$(node -p "require('./hub/package.json').version")" >> "$GITHUB_OUTPUT"
          echo "short=${GITHUB_SHA::7}" >> "$GITHUB_OUTPUT"
      - uses: docker/setup-qemu-action@v3
      - uses: docker/setup-buildx-action@v3
      - name: Log in to GHCR
        if: github.event_name != 'pull_request'
        uses: docker/login-action@v3
        with: { registry: ghcr.io, username: "${{ github.actor }}", password: "${{ secrets.GITHUB_TOKEN }}" }
      # PRs build (amd64 only, fast) to catch Dockerfile breakage without publishing.
      # main builds and pushes a multi-arch manifest: tags <version> (moves with each main build until
      # you bump hub/package.json) and sha-<commit> (immutable; pin this in Terraform for exact deploys).
      - uses: docker/build-push-action@v6
        with:
          context: .
          file: hub/Dockerfile
          platforms: ${{ github.event_name == 'pull_request' && 'linux/amd64' || 'linux/amd64,linux/arm64' }}
          push: ${{ github.event_name != 'pull_request' }}
          tags: |
            ${{ env.IMAGE }}:${{ steps.v.outputs.version }}
            ${{ env.IMAGE }}:sha-${{ steps.v.outputs.short }}
          build-args: |
            VERSION=${{ steps.v.outputs.version }}
            REVISION=${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
          provenance: false
