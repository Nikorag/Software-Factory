name: Hub image
on:
  push:
    branches: [main]
    paths: ["hub/**", "web/**", "pnpm-lock.yaml", "pnpm-workspace.yaml", ".dockerignore", ".github/workflows/hub-image.yml"]
  pull_request:
    paths: ["hub/**", "web/**", "pnpm-lock.yaml", "pnpm-workspace.yaml", ".dockerignore", ".github/workflows/hub-image.yml"]
  workflow_dispatch:

permissions:
  contents: read
  packages: write

# Builds on main run one at a time, in push order. Without this, several merges build in parallel and whichever finishes
# LAST wins the moving <version> tag, which can be an older commit. cancel-in-progress stays off so every commit that gets a
# build still publishes its immutable sha- tag; GitHub drops superseded *queued* runs, so only the newest waits its turn.
concurrency:
  group: hub-image-${{ github.event_name == 'pull_request' && github.ref || 'main' }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  IMAGE: ghcr.io/nikorag/software-factory-hub

jobs:
  image:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - id: v
        run: |
          echo "version=$(node -p "require('./hub/package.json').version")" >> "$GITHUB_OUTPUT"
          echo "short=${GITHUB_SHA::7}" >> "$GITHUB_OUTPUT"
          # Only the commit at the head of main may move the <version> tag (a re-run of an old build must not roll it back).
          if [ "${{ github.event_name }}" = "pull_request" ]; then echo "head=false" >> "$GITHUB_OUTPUT"
          else
            main_sha=$(gh api "repos/${{ github.repository }}/commits/main" --jq .sha)
            [ "$main_sha" = "$GITHUB_SHA" ] && echo "head=true" >> "$GITHUB_OUTPUT" || echo "head=false" >> "$GITHUB_OUTPUT"
          fi
        env:
          GH_TOKEN: ${{ github.token }}
      - uses: docker/setup-qemu-action@v3
      - uses: docker/setup-buildx-action@v3
      - name: Log in to GHCR
        if: github.event_name != 'pull_request'
        uses: docker/login-action@v3
        with: { registry: ghcr.io, username: "${{ github.actor }}", password: "${{ secrets.GITHUB_TOKEN }}" }
      # PRs build (amd64 only, fast) to catch Dockerfile breakage without publishing.
      # main builds and pushes a multi-arch manifest: sha-<commit> (immutable; pin this in Terraform for exact deploys) and, only
      # when this commit is still the head of main, <version> (moves with main until you bump hub/package.json) and
      # latest (always the newest main build).
      - uses: docker/build-push-action@v6
        with:
          context: .
          file: hub/Dockerfile
          platforms: ${{ github.event_name == 'pull_request' && 'linux/amd64' || 'linux/amd64,linux/arm64' }}
          push: ${{ github.event_name != 'pull_request' }}
          tags: |
            ${{ steps.v.outputs.head == 'true' && format('{0}:{1}', env.IMAGE, steps.v.outputs.version) || '' }}
            ${{ steps.v.outputs.head == 'true' && format('{0}:latest', env.IMAGE) || '' }}
            ${{ env.IMAGE }}:sha-${{ steps.v.outputs.short }}
          build-args: |
            VERSION=${{ steps.v.outputs.version }}
            REVISION=${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
          provenance: false
