# DEVELOPMENT ONLY: local Postgres + Redis for `pnpm dev`. Production uses the cluster's existing services.
services:
  postgres:
    image: postgres:16
    environment: { POSTGRES_USER: hub, POSTGRES_PASSWORD: hub, POSTGRES_DB: hub }
    ports: ["5432:5432"]
  redis:
    image: redis:7
    ports: ["6379:6379"]
